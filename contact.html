        body { font-family: 'Poppins', sans-serif; background-color: #0A0A0A; color: white; }

        /* Custom Scrollbar */

        .glass-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(214, 255, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            border-color: rgba(214, 255, 0, 0.3);
        }
        .nav-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:hover {
            transform: translateX(8px);
            background-color: rgba(214, 255, 0, 0.15) !important;
        }
        .nav-btn.active {
            background-color: rgba(214, 255, 0, 0.15);
            border-color: #D6FF00;
            color: #D6FF00;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .timeline-item { position: relative; padding-left: 24px; }
        .timeline-item::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: -20px; width: 2px; background: rgba(214,255,0,0.2); }
        .timeline-item:last-child::before { display: none; }
    </style>

    <script>
        // === YOUR ORIGINAL CONFIG & ALL EXISTING FUNCTIONS (unchanged) ===

            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",

            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };
        const CLOUD_NAME = "dv5bsbydu";
        const UPLOAD_PRESET = "admin_tlaka";
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentEditingKey = null;
        let pendingApproveKey = null;
        let pendingApproveId = null;

        // TAB SWITCHING (unchanged)
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
            if (activeBtn) activeBtn.classList.add('active');
        }

        // === YOUR ORIGINAL FUNCTIONS (syncStats, syncHomepage, updateHero, etc.) remain exactly as you wrote them ===

        // ======================== NEW CONTACTS MANAGEMENT ========================
        let allContacts = {};
        let currentViewKey = null;

        function listenToContacts() {
            db.ref('contacts').on('value', (snapshot) => {
                allContacts = snapshot.val() || {};
                renderContacts();
            });
        }

        function renderContacts() {
            const tbody = document.getElementById('contacts-list');
            tbody.innerHTML = "";

            const sortedKeys = Object.keys(allContacts).sort((a, b) => 
                (allContacts[b].timestamp || 0) - (allContacts[a].timestamp || 0)
            );

            sortedKeys.forEach(key => {
                const c = allContacts[key];
                const date = new Date(c.timestamp || Date.now()).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
                const preview = c.message ? c.message.substring(0, 80) + "..." : "—";

                const row = `
                    <tr class="border-b border-white/5 hover:bg-white/5 cursor-pointer">
                        <td class="px-6 py-4 text-sm">${date}</td>
                        <td class="px-6 py-4 font-medium">${c.name}</td>
                        <td class="px-6 py-4 text-sm">${c.email}</td>
                        <td class="px-6 py-4">${c.subject}</td>
                        <td class="px-6 py-4 text-sm text-gray-400">${preview}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="viewMessage('${key}'); event.stopImmediatePropagation();" class="text-primary hover:text-white px-5 py-2 text-xs font-medium">VIEW</button>
                            <button onclick="deleteContact('${key}'); event.stopImmediatePropagation();" class="text-red-400 hover:text-red-500 px-5 py-2 text-xs font-medium">DELETE</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function viewMessage(key) {
            currentViewKey = key;
            const msg = allContacts[key];
            document.getElementById('view-name').textContent = msg.name || "—";
            document.getElementById('view-email').textContent = msg.email || "—";
            document.getElementById('view-subject').textContent = msg.subject || "—";
            document.getElementById('view-message').textContent = msg.message || "—";
            document.getElementById('view-date').textContent = new Date(msg.timestamp || Date.now()).toLocaleString('en-GB');
            
            const modal = document.getElementById('view-contact-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeViewModal() {
            const modal = document.getElementById('view-contact-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function deleteCurrentContact() {
            if (!currentViewKey) return;
            if (confirm("Delete this message permanently?")) {
                db.ref(`contacts/${currentViewKey}`).remove().then(() => {
                    closeViewModal();
                    showSuccess("Message Deleted", "Inquiry has been removed.");
                });
            }
        }

        function deleteContact(key) {
            if (confirm("Delete this contact message permanently?")) {
                db.ref(`contacts/${key}`).remove();
            }
        }

        function refreshContacts() {
            renderContacts();
        }

        // SUCCESS MODAL (you already have this - just make sure it's there)
        function showSuccess(title, message) {
            document.getElementById('success-title').textContent = title;
            document.getElementById('success-text').innerHTML = message;
            const modal = document.getElementById('success-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeSuccessModal() {
            const modal = document.getElementById('success-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ======================== STARTUP ========================
        window.onload = () => {
            syncStats();
            syncHomepage();
            listenToPending();
            listenToApprovedMembers();
            listenToPayments();
            listenToContacts();          // ← THIS IS THE LINK
            showTab('dashboard');
            window.allMembers = {};
        };
    </script>
