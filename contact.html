<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITCORE - Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#D6FF00', dark: '#0A0A0A', card: '#141414' },
                    fontFamily: { heading: ['Oswald', 'sans-serif'], body: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0A0A0A; color: white; }
        h1, h2, h3, .nav-logo { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .form-input {
            background: #141414;
            border: 1px solid #1f1f1f;
            padding: 1rem;
            width: 100%;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus { border-color: #D6FF00; }
      
        /* Modal Animation */
        #statusModal { transition: opacity 0.3s ease-in-out; }
        .modal-content { transform: scale(0.9); transition: transform 0.3s ease-in-out; }
        #statusModal.flex .modal-content { transform: scale(1); }
    </style>
</head>
<body class="antialiased">
    <div id="statusModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 px-4">
        <div class="modal-content bg-card border border-gray-800 p-8 md:p-12 max-w-md w-full text-center relative">
            <div id="modalIcon" class="mb-6 flex justify-center">
                </div>
            <h2 id="modalTitle" class="text-3xl font-bold mb-2 tracking-tight"></h2>
            <p id="modalMessage" class="text-gray-400 mb-8"></p>
            <button onclick="closeModal()" class="w-full bg-primary text-black font-heading font-bold py-4 uppercase tracking-widest hover:bg-white transition-all">
                Close
            </button>
        </div>
    </div>
    <nav class="absolute top-0 w-full z-50 px-6 py-6 md:px-16 flex justify-between items-center bg-dark/90 border-b border-gray-900">
        <a href="index.html" class="nav-logo text-3xl font-bold text-white">FIT<span class="text-primary">CORE</span></a>
        <div class="hidden md:flex space-x-10 text-sm font-medium uppercase tracking-wide">
            <a href="index.html" class="hover:text-primary transition-colors">Home</a>
            <a href="programs.html" class="hover:text-primary transition-colors">Programs</a>
            <a href="trainers.html" class="hover:text-primary transition-colors">Trainers</a>
            <a href="pricing.html" class="hover:text-primary transition-colors">Pricing</a>
            <a href="contact.html" class="hover:text-primary transition-colors">Contact</a>
        </div>
    </nav>
    <div class="pt-32 min-h-screen grid grid-cols-1 lg:grid-cols-2">
        <div class="p-10 md:p-24 flex flex-col justify-center">
            <h4 class="text-primary font-heading tracking-[0.2em] mb-4 text-sm">Get In Touch</h4>
            <h1 class="text-5xl font-bold mb-8">START YOUR <br><span class="text-primary">JOURNEY</span></h1>
          
            <form id="contactForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="fullName" placeholder="Full Name" class="form-input" required>
                    <input type="email" id="email" placeholder="Email Address" class="form-input" required>
                </div>
                <input type="text" id="subject" placeholder="Subject" class="form-input" required>
                <textarea id="message" rows="5" placeholder="Your Message" class="form-input" required></textarea>
                <button type="submit" id="submitBtn" class="bg-primary text-black font-heading font-bold px-12 py-4 uppercase tracking-widest hover:bg-white transition-all rounded-full">Send Message</button>
            </form>
        </div>
        <div class="relative min-h-[400px] bg-gray-900">
            <img id="contact-bg-image" src="https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=1470&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-50" alt="Gym">
            <div class="absolute inset-0 flex flex-col justify-end p-10 md:p-24 bg-gradient-to-t from-dark">
                <div class="space-y-8">
                    <div>
                        <h4 class="text-primary font-heading tracking-widest uppercase mb-2">Location</h4>
                        <p id="contact-location" class="text-xl text-gray-300">123 Iron Avenue, <br>Muscle District, NY 1001</p>
                    </div>
                    <div>
                        <h4 class="text-primary font-heading tracking-widest uppercase mb-2">Opening Hours</h4>
                        <p id="contact-hours" class="text-xl text-gray-300">Mon - Fri: 5:00 AM - 11:00 PM <br>Sat - Sun: 7:00 AM - 9:00 PM</p>
                    </div>
                    <div class="flex gap-6 mt-10">
                        <a href="#" class="text-white hover:text-primary">Instagram</a>
                        <a href="#" class="text-white hover:text-primary">Facebook</a>
                        <a href="#" class="text-white hover:text-primary">Twitter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Live sync with Admin Dashboard (contactPage node)
        function loadContactPage() {
            database.ref('contactPage').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                // Location (combined from admin's address1 + address2)
                const locationEl = document.getElementById('contact-location');
                if (data.address1 || data.address2) {
                    locationEl.innerHTML = `${data.address1 || ''}<br>${data.address2 || ''}`;
                }
                
                // Opening hours
                const hoursEl = document.getElementById('contact-hours');
                if (data.hoursWeekday || data.hoursWeekend) {
                    hoursEl.innerHTML = `Mon - Fri: ${data.hoursWeekday || '5:00 AM - 11:00 PM'}<br>Sat - Sun: ${data.hoursWeekend || '7:00 AM - 9:00 PM'}`;
                }
                
                // Background image
                const imgEl = document.getElementById('contact-bg-image');
                if (data.imageUrl) {
                    imgEl.src = data.imageUrl;
                }
            });
        }

        // Modal Elements
        const modal = document.getElementById('statusModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalIcon = document.getElementById('modalIcon');
        function showModal(success, title, message) {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
          
            // Set Icon
            if(success) {
                modalIcon.innerHTML = `<svg class="w-20 h-20 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                modalIcon.innerHTML = `<svg class="w-20 h-20 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        // Handle Form Submission
        const contactForm = document.getElementById('contactForm');
      
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;
            // Get form values
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            // Push data to Firebase under 'contacts' node
            const contactRef = database.ref('contacts');
            const newContactRef = contactRef.push();
          
            newContactRef.set({
                name: name,
                email: email,
                subject: subject,
                message: message,
                timestamp: Date.now()
            })
            .then(() => {
                showModal(true, 'SUCCESS!', 'Your message has been received. Our team will contact you shortly.');
                contactForm.reset();
                btn.innerText = "Send Message";
                btn.disabled = false;
            })
            .catch((error) => {
                console.error("Error writing to database", error);
                showModal(false, 'SYSTEM ERROR', 'We could not process your request. Please check your connection and try again.');
                btn.innerText = "Send Message";
                btn.disabled = false;
            });
        });

        // Initialize live contact page data
        window.onload = loadContactPage;
    </script>
</body>
</html>
