<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITCORE - Modern Fitness Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D6FF00',
                        dark: '#0A0A0A',
                        card: '#141414',
                    },
                    fontFamily: {
                        heading: ['Oswald', 'sans-serif'],
                        body: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0A0A0A; color: white; overflow-x: hidden; }
        h1, h2, h3, .nav-logo { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .hero-section { background-image: linear-gradient(to right, rgba(10, 10, 10, 0.95) 30%, rgba(10, 10, 10, 0.4)); background-size: cover; background-position: center; }
        .text-outline { -webkit-text-stroke: 1.5px #D6FF00; color: transparent; }
        .pill { border-radius: 9999px; }
        .card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 25px 50px -12px rgb(214 255 0 / 0.25); }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(214, 255, 0, 0.3); }
        
        /* Subtext Styling for Admin Spans */
        #hero-subtext span { color: white; font-weight: 600; }
        #hero-subtext span.highlight { color: #D6FF00; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeInUp { animation: fadeInUp 0.6s ease forwards; }
        
        .hero-shimmer::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(214, 255, 0, 0.25), transparent);
            animation: heroShimmer 1.5s linear infinite; z-index: 10; pointer-events: none;
        }
        @keyframes heroShimmer { 0% { left: -150%; } 100% { left: 300%; } }
        #hero-text { opacity: 0; transition: opacity 0.6s ease; }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-black">
    <nav class="absolute top-0 w-full z-50 px-6 py-6 md:px-16 flex justify-between items-center">
        <div class="nav-logo text-3xl font-bold tracking-wider text-white">FIT<span class="text-primary">CORE</span></div>
        <div class="hidden md:flex space-x-10 text-sm font-medium uppercase tracking-wide">
            <a href="#" class="hover:text-primary transition-colors">Home</a>
            <a href="#" class="hover:text-primary transition-colors">Programs</a>
            <a href="#" class="hover:text-primary transition-colors">Trainers</a>
            <a href="#" class="hover:text-primary transition-colors">Pricing</a>
        </div>
        <button onclick="showJoinModal()" class="bg-primary text-black font-heading font-bold px-8 py-3 rounded-pill uppercase tracking-wider btn-primary pill">Join Now</button>
    </nav>

    <header id="hero-section" class="hero-section min-h-screen flex items-center pt-20 px-6 md:px-16">
        <div id="hero-content" class="max-w-3xl animate-fadeInUp hero-shimmer">
            <div id="hero-text">
                <h4 class="text-primary font-heading tracking-[0.2em] mb-4 text-sm md:text-base">Unleash your potential</h4>
                <h1 id="hero-main-heading" class="text-6xl md:text-8xl font-bold leading-none mb-6">
                    BUILD YOUR <br>
                    <span class="text-outline">PERFECT</span> BODY
                </h1>
                <p id="hero-subtext" class="text-gray-400 text-lg md:text-xl mb-10 max-w-xl font-light leading-relaxed">
                    Loading your transformation...
                </p>
                <div class="flex flex-col sm:flex-row gap-4">
                    <button onclick="showJoinModal()" id="hero-button" class="bg-primary text-black font-heading font-bold px-10 py-4 text-lg uppercase tracking-wider rounded-pill btn-primary pill">Get Started Free</button>
                    <button onclick="showVideoModal()" class="border border-white text-white font-heading font-bold px-10 py-4 text-lg uppercase tracking-wider rounded-pill hover:bg-white hover:text-black transition-colors duration-300">Watch Video</button>
                </div>
                
                <div class="flex gap-10 mt-16 border-t border-gray-800 pt-8">
                    <div><h3 id="stat-trainers" class="text-3xl font-bold text-white mb-1">...</h3><p class="text-gray-500 text-sm">Expert Trainers</p></div>
                    <div><h3 id="stat-members" class="text-3xl font-bold text-white mb-1">...</h3><p class="text-gray-500 text-sm">Active Members</p></div>
                    <div><h3 id="stat-programs" class="text-3xl font-bold text-white mb-1">...</h3><p class="text-gray-500 text-sm">Fitness Programs</p></div>
                </div>
            </div>
        </div>
    </header>

    <div id="join-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-card border border-gray-900 w-full max-w-lg rounded-3xl p-8 animate-fadeInUp">
            <h3 class="text-2xl font-bold mb-6">Join FITCORE</h3>
            <form onsubmit="handleJoinSubmit(event)" class="space-y-4">
                <input id="join-name" type="text" placeholder="Full Name" required class="w-full bg-dark border border-gray-700 rounded-2xl px-5 py-4 focus:border-primary outline-none">
                <button type="submit" class="w-full py-4 bg-primary text-black font-bold rounded-full uppercase">Submit Request</button>
                <button type="button" onclick="hideJoinModal()" class="w-full text-gray-500 mt-2">Close</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function syncHomepageContent() {
            db.ref('homepage/hero').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                // 1. Update Heading
                if (data.heading) document.getElementById("hero-main-heading").innerHTML = data.heading;
                
                // 2. UPDATE SUBTEXT (Using .innerHTML to support <span> tags from admin)
                if (data.subtext) {
                    document.getElementById("hero-subtext").innerHTML = data.subtext;
                }

                if (data.buttonText) document.getElementById("hero-button").innerText = data.buttonText;
                
                if (data.imageUrl) {
                    document.getElementById("hero-section").style.backgroundImage = `linear-gradient(to right, rgba(10, 10, 10, 0.95) 30%, rgba(10, 10, 10, 0.4)), url('${data.imageUrl}')`;
                }

                // Reveal UI
                document.getElementById("hero-content").classList.remove("hero-shimmer");
                document.getElementById("hero-text").style.opacity = "1";
            });
        }

        function loadLiveStats() {
            db.ref('stats/trainers').on('value', s => document.getElementById("stat-trainers").innerText = s.val() || "50+");
            db.ref('stats/members').on('value', s => document.getElementById("stat-members").innerText = s.val() || "970+");
            db.ref('stats/programs').on('value', s => document.getElementById("stat-programs").innerText = s.val() || "30+");
        }

        function showJoinModal() { document.getElementById("join-modal").classList.remove("hidden"); }
        function hideJoinModal() { document.getElementById("join-modal").classList.add("hidden"); }

        window.onload = () => {
            loadLiveStats();
            syncHomepageContent();
        };
    </script>
</body>
</html>
