<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FITCORE - Membership Pricing</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: { primary: '#D6FF00', dark: '#0A0A0A', card: '#141414' },

                    fontFamily: { heading: ['Oswald', 'sans-serif'], body: ['Poppins', 'sans-serif'] },

                    borderRadius: { 'pill': '9999px' }

                }

            }

        }

    </script>

    <style>

        body { font-family: 'Poppins', sans-serif; background-color: #0A0A0A; color: white; }

        h1, h2, h3, .nav-logo { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        .text-outline { -webkit-text-stroke: 1px #D6FF00; color: transparent; }

        #successModal { transition: opacity 0.3s ease-in-out; }

      

        /* OVAL / HEAVILY ROUNDED CARDS */

        .pricing-card {

            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            border-radius: 2.5rem;

        }

        .pricing-card:hover {

            transform: translateY(-10px);

            border-color: #D6FF00;

            box-shadow: 0 10px 30px -10px rgba(214, 255, 0, 0.3);

        }

      

        /* PILL-SHAPED BUTTONS */

        .pill-btn {

            border-radius: 9999px;

        }

        /* JOIN NOW BUTTON - EXACT SAME HOVER AS HOME PAGE */

        .btn-primary {

            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);

        }

        .btn-primary:hover {

            transform: scale(1.05);

            box-shadow: 0 0 0 4px rgba(214, 255, 0, 0.3);

        }

      

        .btn-loading { pointer-events: none; opacity: 0.6; }

    </style>

</head>

<body class="antialiased">

    <!-- JOIN FITCORE MODAL - EXACT SAME AS HOME PAGE -->

    <div id="join-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">

        <div class="bg-card border border-gray-900 w-full max-w-lg rounded-3xl p-8">

            <h3 class="text-2xl font-bold mb-6">Join FITCORE</h3>

            <form id="join-form" onsubmit="handleJoinSubmit(event)">

                <div class="space-y-6">

                    <input id="join-name" type="text" placeholder="Full Name" required class="w-full bg-dark border border-gray-700 rounded-2xl px-5 py-4 focus:border-primary outline-none text-white">

                    <input id="join-email" type="email" placeholder="Email Address" required class="w-full bg-dark border border-gray-700 rounded-2xl px-5 py-4 focus:border-primary outline-none text-white">

                    <input id="join-phone" type="tel" placeholder="Phone Number" required class="w-full bg-dark border border-gray-700 rounded-2xl px-5 py-4 focus:border-primary outline-none text-white">

                    <select id="join-plan" required class="w-full bg-dark border border-gray-700 rounded-2xl px-5 py-4 focus:border-primary outline-none text-white">

                        <option value="">Select Plan</option>

                        <option value="Monthly">Monthly</option>

                        <option value="Annual">Annual</option>

                    </select>

                </div>

                <div class="flex gap-4 mt-8">

                    <button type="button" onclick="hideJoinModal()" class="flex-1 py-4 border border-gray-700 rounded-full">Cancel</button>

                    <button id="submit-btn" type="submit" class="flex-1 py-4 bg-primary text-black font-bold rounded-full">Submit Request</button>

                </div>

            </form>

        </div>

    </div>

    <!-- JOIN SUCCESS MODAL - EXACT SAME AS HOME PAGE -->

    <div id="success-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[70] px-6">

        <div class="bg-card border border-primary/30 w-full max-w-sm rounded-3xl p-10 text-center">

            <div class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-6">

                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>

            </div>

            <h3 class="text-2xl font-bold mb-2 uppercase">Success!</h3>

            <p class="text-gray-400 mb-8">Data sent to admin dashboard.</p>

            <button onclick="hideSuccessModal()" class="w-full py-4 bg-primary text-black font-bold rounded-full uppercase">Close</button>

        </div>

    </div>

    <!-- PRICING SUCCESS MODAL (kept completely unchanged) -->

    <div id="successModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-black/90 backdrop-blur-md">

        <div class="bg-card border-2 border-primary p-8 md:p-12 max-w-md w-full text-center shadow-[0_0_50px_rgba(214,255,0,0.2)] rounded-3xl">

            <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center mx-auto mb-6">

                <svg class="w-10 h-10 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>

            </div>

            <h2 class="text-3xl font-bold mb-2">WELCOME TO THE TEAM</h2>

            <p class="text-gray-400 mb-8">Your <span id="selectedPlanName" class="text-primary font-bold"></span> plan selection has been recorded. Our team will contact you shortly.</p>

            <button onclick="closeModal()" class="w-full py-4 bg-primary text-black font-heading font-bold uppercase tracking-widest hover:bg-white transition-all pill-btn">Continue</button>

        </div>

    </div>

    <nav class="absolute top-0 w-full z-50 px-6 py-6 md:px-16 flex justify-between items-center bg-dark/90 backdrop-blur-sm border-b border-gray-900">

        <a href="index.html" class="nav-logo text-3xl font-bold tracking-wider text-white">FIT<span class="text-primary">CORE</span></a>

        <div class="hidden md:flex space-x-10 text-sm font-medium uppercase tracking-wide">

            <a href="index.html" class="hover:text-primary transition-colors">Home</a>

            <a href="programs.html" class="hover:text-primary transition-colors">Programs</a>

            <a href="trainers.html" class="hover:text-primary transition-colors">Trainers</a>

            <a href="pricing.html" class="text-primary transition-colors">Pricing</a>

            <a href="contact.html" class="hover:text-primary transition-colors">Contact</a>

        </div>

        <!-- JOIN NOW BUTTON - NOW PILL-SHAPED -->

        <button onclick="showJoinModal()"

                class="bg-primary text-black font-heading font-bold px-8 py-3 uppercase tracking-wider btn-primary pill rounded-full">

            Join Now

        </button>

    </nav>

    <header class="pt-40 pb-20 px-6 text-center bg-card border-b border-gray-900">

        <h4 class="text-primary font-heading tracking-[0.2em] mb-4 text-sm">Flexible Plans</h4>

        <h1 class="text-5xl md:text-7xl font-bold leading-none mb-6">CHOOSE YOUR <span class="text-outline">LEVEL</span></h1>

    </header>

    <section id="pricing-section" class="py-24 px-6 md:px-16 max-w-7xl mx-auto">

        <div id="pricing-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">

        </div>

    </section>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>

        const firebaseConfig = {

            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",

            authDomain: "pinotp-d7ef5.firebaseapp.com",

            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",

            projectId: "pinotp-d7ef5",

            storageBucket: "pinotp-d7ef5.firebasestorage.app",

            messagingSenderId: "708458917827",

            appId: "1:708458917827:web:375de278577df0adcf9776"

        };

     

        firebase.initializeApp(firebaseConfig);

        const database = firebase.database();

        // ==================== JOIN MODAL FUNCTIONS - EXACT SAME AS HOME PAGE ====================

        function showJoinModal() {

            document.getElementById("join-modal").classList.remove("hidden");

            document.body.style.overflow = "hidden";

        }

        function hideJoinModal() {

            document.getElementById("join-modal").classList.add("hidden");

            document.body.style.overflow = "auto";

        }

        function showSuccessModal() {

            document.getElementById("success-modal").classList.remove("hidden");

        }

        function hideSuccessModal() {

            document.getElementById("success-modal").classList.add("hidden");

            document.body.style.overflow = "auto";

        }

        async function handleJoinSubmit(e) {

            e.preventDefault();

            const btn = document.getElementById("submit-btn");

            const data = {

                name: document.getElementById("join-name").value,

                email: document.getElementById("join-email").value,

                phone: document.getElementById("join-phone").value,

                plan: document.getElementById("join-plan").value,

                timestamp: Date.now()

            };

            try {

                btn.disabled = true;

                btn.innerText = "Sending...";

                await database.ref('membershipRequests').push(data);

                hideJoinModal();

                showSuccessModal();

                document.getElementById("join-form").reset();

            } catch (err) {

                alert("Error connecting to database.");

            } finally {

                btn.disabled = false;

                btn.innerText = "Submit Request";

            }

        }

        // ==================== PRICING LOGIC (COMPLETELY UNCHANGED) ====================

        function loadPricing() {

            database.ref('pricing/packages').on('value', (snapshot) => {

                const data = snapshot.val() || {};

                const container = document.getElementById('pricing-grid');

                container.innerHTML = '';

                const sortedKeys = Object.keys(data).sort((a, b) =>

                    (data[a].order || 9999) - (data[b].order || 9999)

                );

                sortedKeys.forEach(key => {

                    const p = data[key];

                    const isPopular = !!p.isPopular;

                    const cardHTML = `

                        <div class="pricing-card ${isPopular ?

                            'bg-dark p-10 border-2 border-primary relative transform md:-translate-y-4 shadow-[0_0_40px_rgba(214,255,0,0.1)]' :

                            'bg-card p-10 border border-gray-800'}">

                            ${isPopular ? `

                            <div class="absolute top-0 right-0 bg-primary text-black font-heading font-bold px-4 py-1 text-xs tracking-widest uppercase rounded-bl-3xl">

                                Most Popular

                            </div>` : ''}

                            <h3 class="text-xl font-bold mb-2">${p.title || 'Plan'}</h3>

                            <div class="flex items-baseline mb-8">

                                <span class="text-4xl font-bold">R</span>

                                <span class="text-7xl font-bold tracking-tighter ${isPopular ? 'text-primary' : ''}">${p.price || 0}</span>

                                <span class="text-gray-500 ml-2">${p.period || '/mo'}</span>

                            </div>

                            <ul class="space-y-4 mb-10 ${isPopular ? 'text-gray-300' : 'text-gray-400'}">

                                ${(p.features || '').split('\n').map(line => {

                                    if (!line.trim()) return '';

                                    return `

                                    <li class="flex items-center">

                                        <svg class="w-5 h-5 text-primary mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>

                                        </svg>

                                        ${line.trim()}

                                    </li>`;

                                }).join('')}

                            </ul>

                            <button onclick="selectPlan('${p.title}', ${p.price})"

                                    class="w-full py-4 ${isPopular ?

                                        'bg-primary text-black' :

                                        'border border-white hover:bg-white hover:text-black'}

                                    font-heading font-bold uppercase tracking-widest transition-all pill-btn">

                                ${p.buttonText || (isPopular ? 'Get Started' : 'Select Plan')}

                            </button>

                        </div>

                    `;

                    container.innerHTML += cardHTML;

                });

            });

        }

        async function selectPlan(planName, price) {

            const buttons = document.querySelectorAll('button[onclick^="selectPlan"]');

            let btn = null;

            for (let b of buttons) {

                if (b.getAttribute('onclick').includes(planName)) {

                    btn = b;

                    break;

                }

            }

            if (btn) {

                btn.innerText = "Processing...";

                btn.classList.add('btn-loading');

            }

            try {

                await database.ref('membership_selections').push({

                    plan: planName,

                    price: price,

                    timestamp: new Date().toISOString()

                });

                showModal(planName);

            } catch (err) {

                console.error(err);

                alert("Connection error.");

            } finally {

                if (btn) {

                    btn.innerText = "Select Plan";

                    btn.classList.remove('btn-loading');

                }

            }

        }

        function showModal(planName) {

            document.getElementById('selectedPlanName').innerText = planName;

            const modal = document.getElementById('successModal');

            modal.classList.remove('hidden');

            modal.classList.add('flex');

            document.body.style.overflow = 'hidden';

        }

        function closeModal() {

            const modal = document.getElementById('successModal');

            modal.classList.add('hidden');

            modal.classList.remove('flex');

            document.body.style.overflow = 'auto';

        }

        window.onload = loadPricing;

    </script>

</body>

</html>
