<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITCORE - Our Programs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#D6FF00', dark: '#0A0A0A', card: '#141414' },
                    fontFamily: { heading: ['Oswald', 'sans-serif'], body: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0A0A0A; color: white; overflow-x: hidden; }
        h1, h2, h3, .nav-logo { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .text-outline { -webkit-text-stroke: 1px #D6FF00; color: transparent; }
        .program-card { transition: all 0.4s ease; }
        .program-card:hover img { transform: scale(1.1); }
        
        /* Modal Animation */
        #details-modal { transition: opacity 0.3s ease; }
        #details-modal.hidden { display: none; opacity: 0; }
        #details-modal.flex { display: flex; opacity: 1; }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-black">
    <nav class="absolute top-0 w-full z-50 px-6 py-6 md:px-16 flex justify-between items-center bg-dark/90 backdrop-blur-sm border-b border-gray-900">
        <a href="index.html" class="nav-logo text-3xl font-bold tracking-wider text-white">
            FIT<span class="text-primary">CORE</span>
        </a>
        <div class="hidden md:flex space-x-10 text-sm font-medium uppercase tracking-wide">
            <a href="index.html" class="hover:text-primary transition-colors">Home</a>
            <a href="programs.html" class="text-primary transition-colors">Programs</a>
            <a href="trainers.html" class="hover:text-primary transition-colors">Trainers</a>
            <a href="pricing.html" class="hover:text-primary transition-colors">Pricing</a>
            <a href="contact.html" class="hover:text-primary transition-colors">Contact</a>
        </div>
        <button onclick="window.location.href='pricing.html'" class="bg-primary text-black font-heading font-bold px-8 py-3 uppercase tracking-wider hover:bg-white transition-colors rounded-full">
            Join Now
        </button>
    </nav>

    <header class="pt-40 pb-20 px-6 md:px-16 bg-card border-b border-gray-900">
        <div class="max-w-4xl mx-auto text-center">
            <h4 class="text-primary font-heading tracking-[0.2em] mb-4 text-sm">Choose Your Path</h4>
            <h1 class="text-5xl md:text-7xl font-bold leading-none mb-6">ELITE <span class="text-outline">PROGRAMS</span></h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto font-light">Whether you want to build muscle, lose weight, or improve your overall endurance, we have a specialized program designed for your exact goals.</p>
        </div>
    </header>

    <section class="py-24 px-6 md:px-16 max-w-7xl mx-auto">
        <div id="programs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </section>

    <div id="details-modal" class="hidden fixed inset-0 z-[100] items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="bg-card border border-gray-800 max-w-2xl w-full relative overflow-hidden">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-white hover:text-primary z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <div class="flex flex-col md:flex-row">
                <div class="w-full md:w-1/2 h-64 md:h-auto">
                    <img id="modal-image" src="" alt="" class="w-full h-full object-cover">
                </div>
                <div class="w-full md:w-1/2 p-8 flex flex-col justify-center">
                    <span id="modal-category" class="text-primary text-xs font-bold tracking-widest uppercase mb-2 block"></span>
                    <h3 id="modal-title" class="text-4xl font-bold mb-4"></h3>
                    <p id="modal-description" class="text-gray-400 mb-8 font-light leading-relaxed"></p>
                    <button onclick="closeModal()" class="bg-primary text-black font-heading font-bold px-6 py-3 uppercase text-sm tracking-widest hover:bg-white transition-colors">
                        Close Details
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Modified to show modal and keep tracking
        function trackInterest(title, category, description, image) {
            console.log("Tracking interest for:", title);
            
            // Log to Firebase
            const interestRef = database.ref('program_clicks');
            interestRef.push({
                program: title,
                timestamp: new Date().toISOString()
            });

            // Update Modal Content
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-category').innerText = category;
            document.getElementById('modal-description').innerText = description;
            document.getElementById('modal-image').src = image;

            // Show Modal
            const modal = document.getElementById('details-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }

        function closeModal() {
            const modal = document.getElementById('details-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }

        // Render programs exactly like your original design, updated click handler
        function renderPrograms(programs) {
            const grid = document.getElementById('programs-grid');
            grid.innerHTML = '';

            if (!programs || Object.keys(programs).length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-center text-gray-400 py-12">No programs added yet. Admin can add them now.</p>`;
                return;
            }

            Object.keys(programs).sort((a, b) => (programs[a].order || 0) - (programs[b].order || 0)).forEach(key => {
                const p = programs[key];
                // We escape quotes in the strings to prevent HTML breaking
                const safeTitle = p.title.replace(/'/g, "\\'");
                const safeCat = p.category.replace(/'/g, "\\'");
                const safeDesc = p.description.replace(/'/g, "\\'");
                
                const cardHTML = `
                    <div onclick="trackInterest('${safeTitle}', '${safeCat}', '${safeDesc}', '${p.image}')" class="program-card relative h-96 overflow-hidden group cursor-pointer border border-gray-900">
                        <img src="${p.image}" alt="${p.title}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-90 group-hover:opacity-75 transition-opacity"></div>
                        <div class="absolute bottom-0 left-0 p-8 w-full transform translate-y-4 group-hover:translate-y-0 transition-transform">
                            <span class="text-primary text-xs font-bold tracking-widest uppercase mb-2 block">${p.category}</span>
                            <h3 class="text-3xl font-bold mb-3">${p.title}</h3>
                            <p class="text-gray-300 text-sm mb-4 opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100">${p.description}</p>
                            <span class="inline-block border-b border-primary text-primary font-heading uppercase tracking-widest text-sm pb-1">View Details</span>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Load programs in real-time
        function loadPrograms() {
            database.ref('programs').on('value', (snapshot) => {
                const programsData = snapshot.val();
                renderPrograms(programsData);
            });
        }

        // Seed initial programs (only runs once)
        function seedInitialPrograms() {
            database.ref('programs').once('value', (snap) => {
                if (!snap.exists()) {
                    const initial = {
                        p1: {
                            category: "01 / Build Muscle",
                            title: "Powerlifting",
                            description: "Master the squat, bench, and deadlift with our heavy-duty strength cycles. Designed for those looking to move maximum weight.",
                            image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop",
                            order: 1
                        },
                        p2: {
                            category: "02 / Shred Fat",
                            title: "HIIT Core",
                            description: "High-Intensity Interval Training designed to torch calories and build endurance fast through explosive movements.",
                            image: "https://images.unsplash.com/photo-1518611012118-696072aa579a?q=80&w=1470&auto=format&fit=crop",
                            order: 2
                        },
                        p3: {
                            category: "03 / Recovery",
                            title: "Mobility & Yoga",
                            description: "Improve flexibility, prevent injuries, and clear your mind with active recovery techniques and deep stretching.",
                            image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=1520&auto=format&fit=crop",
                            order: 3
                        }
                    };
                    database.ref('programs').set(initial);
                }
            });
        }

        window.onload = () => {
            seedInitialPrograms();
            loadPrograms();
        };

        // Close modal if user clicks outside the content box
        window.onclick = function(event) {
            const modal = document.getElementById('details-modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
