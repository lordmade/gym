<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITCORE - Expert Trainers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#D6FF00', dark: '#0A0A0A', card: '#141414' }, fontFamily: { heading: ['Oswald', 'sans-serif'], body: ['Poppins', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0A0A0A; color: white; overflow-x: hidden; }
        h1, h2, h3, .nav-logo { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .text-outline { -webkit-text-stroke: 1px #D6FF00; color: transparent; }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-black">
    <nav class="absolute top-0 w-full z-50 px-6 py-6 md:px-16 flex justify-between items-center bg-dark/90 backdrop-blur-sm border-b border-gray-900">
        <a href="index.html" class="nav-logo text-3xl font-bold tracking-wider text-white">FIT<span class="text-primary">CORE</span></a>
        <div class="hidden md:flex space-x-10 text-sm font-medium uppercase tracking-wide">
            <a href="index.html" class="hover:text-primary transition-colors">Home</a>
            <a href="programs.html" class="hover:text-primary transition-colors">Programs</a>
            <a href="trainers.html" class="text-primary transition-colors">Trainers</a>
            <a href="pricing.html" class="hover:text-primary transition-colors">Pricing</a>
        </div>
        <button class="bg-primary text-black font-heading font-bold px-8 py-3 uppercase tracking-wider hover:bg-white transition-colors">Join Now</button>
    </nav>

    <header class="pt-40 pb-20 px-6 md:px-16 bg-card border-b border-gray-900">
        <div class="max-w-4xl mx-auto text-center">
            <h4 class="text-primary font-heading tracking-[0.2em] mb-4 text-sm">Meet The Experts</h4>
            <h1 class="text-5xl md:text-7xl font-bold leading-none mb-6">YOUR <span class="text-outline">COACHES</span></h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto font-light">Train with industry-leading professionals who will push you past your limits and ensure you reach your maximum potential.</p>
        </div>
    </header>

    <section class="py-24 px-6 md:px-16 max-w-7xl mx-auto">
        <div id="trainers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Dynamic trainers loaded here -->
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Log trainer click (kept from your original code)
        function logTrainerClick(trainerName) {
            database.ref('trainer_views').push({
                trainer: trainerName,
                timestamp: new Date().toISOString()
            });
        }

        // Render dynamic trainers
        function renderTrainers(trainers) {
            const grid = document.getElementById('trainers-grid');
            grid.innerHTML = '';

            if (!trainers || Object.keys(trainers).length === 0) {
                grid.innerHTML = `<p class="col-span-4 text-center text-gray-400 py-12">No trainers added yet. Admin can add them now.</p>`;
                return;
            }

            Object.keys(trainers).forEach(key => {
                const t = trainers[key];
                const cardHTML = `
                    <div class="group relative cursor-pointer" onclick="logTrainerClick('${t.name}')">
                        <div class="w-full h-96 overflow-hidden bg-gray-900 mb-6 border border-gray-800 relative">
                            <img src="${t.image}" alt="${t.name}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500">
                            <div class="absolute bottom-0 w-full p-4 flex justify-center space-x-4 translate-y-full group-hover:translate-y-0 transition-transform duration-300 bg-black/80 backdrop-blur-sm">
                                <span class="text-white hover:text-primary transition-colors text-xs font-bold">VIEW PROFILE</span>
                            </div>
                        </div>
                        <h3 class="text-2xl font-bold mb-1">${t.name}</h3>
                        <p class="text-primary text-sm font-heading tracking-widest uppercase">${t.title}</p>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Load trainers in real-time
        function loadTrainers() {
            database.ref('trainers').on('value', (snapshot) => {
                const trainersData = snapshot.val();
                renderTrainers(trainersData);
            });
        }

        // Seed initial trainers if database is empty (runs once)
        function seedInitialTrainers() {
            database.ref('trainers').once('value', (snap) => {
                if (!snap.exists()) {
                    const initial = {
                        t1: { name: "Marcus Thorne", title: "Head Strength Coach", image: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?q=80&w=1470&auto=format&fit=crop", order: 1 },
                        t2: { name: "Elena Rostova", title: "HIIT & Conditioning", image: "https://images.unsplash.com/photo-1594381898411-846e7d193883?q=80&w=1374&auto=format&fit=crop", order: 2 },
                        t3: { name: "David Chen", title: "CrossFit Specialist", image: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?q=80&w=1470&auto=format&fit=crop", order: 3 },
                        t4: { name: "Sarah Jenkins", title: "Yoga & Mobility", image: "https://images.unsplash.com/photo-1518310383802-640c2de311b2?q=80&w=1470&auto=format&fit=crop", order: 4 }
                    };
                    database.ref('trainers').set(initial);
                }
            });
        }

        window.onload = () => {
            seedInitialTrainers();
            loadTrainers();
        };
    </script>
</body>
</html>
